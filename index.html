<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وحدة مهارات القرن 21</title>
<meta name="description" content="وحدة مهارات القرن 21 — Empowering Students for the Future. ستة برامج متكاملة: الذكاء العاطفي، البحث العلمي، التصميم من أجل التغيير، ريادة الأعمال، الروبوت والطباعة ثلاثية الأبعاد، STEM.">
<meta name="theme-color" content="#F5F6FC">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@300;600;900&family=Sora:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F5F6FC;
    --ink:#14173A;
    --muted:#565D8C;
    --glass:rgba(255,255,255,.66);
    --glass-edge:rgba(255,255,255,.95);
    --line:rgba(60,70,160,.14);
    --violet:#6D4BFF; --cyan:#0EA5D6; --green:#0E9F76; --orange:#E8790A; --pink:#E63E7C;
    --foil:linear-gradient(100deg,#6D4BFF 0%,#0EA5D6 20%,#0E9F76 40%,#E8790A 60%,#E63E7C 80%,#6D4BFF 100%);
    --display:'Sora','Noto Kufi Arabic','IBM Plex Sans Arabic',Tahoma,sans-serif;
    --body:'IBM Plex Sans Arabic','Sora',Tahoma,sans-serif;
    --wrap:1200px;
    --start:right;   /* جهة بداية الاتجاه: تتبدل مع اللغة */
    --flip:1;        /* قلب الأسهم بين RTL و LTR */
    --fx:-1;
  }
  html[dir="ltr"]{--start:left;--flip:-1;--fx:1}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:100px;overflow-x:clip}
  body{
    font-family:var(--body);background:var(--bg);color:var(--ink);
    line-height:1.85;font-size:17px;-webkit-font-smoothing:antialiased;overflow-x:clip;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:10px}
  .wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:24px}

  /* خلفية ضوئية بطيئة الحركة */
  .aurora{
    position:fixed;inset:-25%;z-index:-1;pointer-events:none;
    background:
      radial-gradient(40% 35% at 20% 25%,rgba(109,75,255,.22),transparent 70%),
      radial-gradient(35% 30% at 80% 20%,rgba(14,165,214,.20),transparent 70%),
      radial-gradient(38% 34% at 72% 80%,rgba(230,62,124,.16),transparent 70%),
      radial-gradient(34% 30% at 15% 85%,rgba(232,121,10,.14),transparent 70%);
    animation:drift 28s ease-in-out infinite alternate;
  }
  @keyframes drift{to{transform:translate3d(4%,3%,0) rotate(6deg) scale(1.08)}}

  /* ---------- الشريط العلوي العائم ---------- */
  .nav{
    position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:60;
    width:min(1200px,calc(100% - 24px));height:66px;padding-inline:16px 12px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid var(--glass-edge);border-radius:22px;
    box-shadow:0 12px 36px -16px rgba(40,50,140,.35);
  }
  .logos{display:flex;align-items:center;gap:12px}
  .logos .sep{width:1px;height:30px;background:var(--line)}
  .logo{position:relative;display:inline-flex;align-items:center;justify-content:center;height:44px;min-width:44px}
  .logo img{height:44px;width:auto;display:block}
  .logo .ph{display:none;font-size:11.5px;line-height:1.3;color:var(--muted);text-align:center;
    border:1.5px dashed rgba(60,70,160,.35);border-radius:11px;padding:5px 10px;white-space:nowrap}
  .logo.missing img{display:none}
  .logo.missing .ph{display:block}
  .nav-right{display:flex;align-items:center;gap:6px}
  .nav-links{display:flex;align-items:center;gap:2px}
  .nav-links a{padding:8px 14px;border-radius:14px;font-size:15px;color:var(--muted);transition:background .2s,color .2s;white-space:nowrap}
  .nav-links a:hover{background:rgba(109,75,255,.09);color:var(--ink)}
  .lang{
    direction:ltr;display:inline-flex;align-items:center;padding:3px;border:0;border-radius:14px;
    background:rgba(20,23,58,.07);font-family:'Sora',sans-serif;font-weight:600;font-size:13px;
  }
  .lang span{padding:6px 12px;border-radius:11px;color:var(--muted);transition:background .2s,color .2s}
  html[lang="ar"] .lang [data-l="ar"],html[lang="en"] .lang [data-l="en"]{background:var(--ink);color:#fff}

  /* ---------- الهيرو ---------- */
  .hero{position:relative;padding:130px 0 70px;overflow:hidden}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .hero-grid{position:relative;display:grid;grid-template-columns:1fr 1.05fr;gap:28px;align-items:center}
  .hero-text{position:relative;z-index:2}
  .hero h1{
    font-family:var(--display);font-weight:900;
    font-size:clamp(38px,5.6vw,78px);line-height:1.32;margin-bottom:12px;text-wrap:balance;
    background-image:var(--foil);background-size:200% 100%;background-repeat:repeat-x;
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    animation:foil 10s linear infinite,rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes foil{to{background-position:200% 0}}
  @keyframes rise{from{opacity:0;transform:translateY(26px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
  .hero-sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:26px;font-family:var(--display);font-weight:600;color:var(--muted);font-size:clamp(14px,1.4vw,18px);animation:rise .9s .1s cubic-bezier(.2,.8,.2,1) both}
  .hero-sub .vbar{width:1.5px;height:1.1em;background:rgba(60,70,160,.3)}
  .duo{font-family:var(--display);line-height:1.6}
  .duo span{display:block}
  .duo .a{font-weight:300;color:var(--muted)}
  .duo .b{font-weight:900;color:var(--ink)}
  .hero .duo{font-size:clamp(20px,2.3vw,30px);margin-bottom:14px;animation:rise .9s .18s cubic-bezier(.2,.8,.2,1) both}
  .hero .lead{font-size:clamp(16px,1.5vw,19px);color:var(--muted);max-width:33em;margin-bottom:32px;animation:rise .9s .28s cubic-bezier(.2,.8,.2,1) both}
  .btns{display:flex;flex-wrap:wrap;gap:12px;animation:rise .9s .38s cubic-bezier(.2,.8,.2,1) both}
  .btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:16px;padding:15px 30px;border-radius:16px;transition:transform .2s,box-shadow .2s,background .2s}
  .btn.primary{color:#fff;background:linear-gradient(135deg,var(--violet),var(--pink));box-shadow:0 14px 30px -12px rgba(109,75,255,.7)}
  .btn.primary:hover{transform:translateY(-3px);box-shadow:0 20px 36px -12px rgba(230,62,124,.65)}
  .btn.ghost{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:0 8px 24px -14px rgba(40,50,140,.4)}
  .btn.ghost:hover{background:#fff;transform:translateY(-3px)}

  /* ---------- مجموعة البرامج المدارية ---------- */
  .orrery{
    --R:31cqw;--ob:15cqw;
    container-type:inline-size;position:relative;z-index:2;
    width:100%;max-width:680px;aspect-ratio:1/1;margin-inline:auto;
  }
  .scene{position:absolute;inset:0;transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out}
  .orbit-ring{position:absolute;left:50%;top:50%;translate:-50% -50%;border-radius:50%;pointer-events:none}
  .orbit-ring.r1{width:calc(var(--R)*2);height:calc(var(--R)*2);border:1.5px dashed rgba(20,23,58,.2)}
  .orbit-ring.r2{width:calc(var(--R)*1.28);height:calc(var(--R)*1.28);border:1px solid rgba(109,75,255,.16)}
  .pulse{position:absolute;left:50%;top:50%;translate:-50% -50%;width:25cqw;height:25cqw;border-radius:50%;border:1.5px solid rgba(109,75,255,.5);animation:pulse 4.5s ease-out infinite}
  .pulse.p2{animation-delay:2.25s}
  @keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}
  .core{
    position:absolute;left:50%;top:50%;translate:-50% -50%;width:25cqw;height:25cqw;border-radius:50%;overflow:hidden;
    display:grid;place-content:center;text-align:center;color:#fff;
    box-shadow:0 3cqw 6cqw -2cqw rgba(109,75,255,.65),inset -1.4cqw -2cqw 3cqw rgba(20,23,58,.3),inset .8cqw 1cqw 2cqw rgba(255,255,255,.5);
  }
  .core-foil{position:absolute;inset:-25%;background:conic-gradient(from 0deg,#6D4BFF,#0EA5D6,#0E9F76,#E8790A,#E63E7C,#6D4BFF);animation:spin 14s linear infinite}
  .core-gloss{position:absolute;inset:0;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.6),transparent 42%),radial-gradient(circle at 70% 92%,rgba(20,23,58,.38),transparent 55%)}
  .core b{position:relative;font-family:var(--display);font-weight:900;font-size:10cqw;line-height:1;text-shadow:0 .5cqw 1.2cqw rgba(20,23,58,.3);direction:ltr}
  .core span{position:relative;font-family:var(--display);font-weight:600;font-size:clamp(10px,2.4cqw,16px);margin-top:.5cqw;text-shadow:0 1px 6px rgba(20,23,58,.35)}
  @keyframes spin{to{transform:rotate(360deg)}}

  .ring{position:absolute;inset:0;animation:spin 90s linear infinite}
  .slot{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateX(var(--R))}
  .up1{position:absolute;left:0;top:0;transform:rotate(calc(-1 * var(--a)))}
  .up2{position:absolute;left:0;top:0;animation:spin 90s linear infinite reverse}
  .orrery:hover .ring,.orrery:hover .up2,.orrery:focus-within .ring,.orrery:focus-within .up2{animation-play-state:paused}

  .orb{position:absolute;left:calc(var(--ob) / -2);top:calc(var(--ob) / -2);width:var(--ob);display:block;text-align:center}
  .ball{
    position:relative;display:grid;place-items:center;width:var(--ob);height:var(--ob);border-radius:50%;
    background:radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--c) 40%,#fff) 0%,var(--c) 48%,color-mix(in srgb,var(--c) 72%,#14173A) 100%);
    box-shadow:0 2.4cqw 4cqw -1.2cqw color-mix(in srgb,var(--c) 75%,transparent),inset -1cqw -1.4cqw 2.2cqw rgba(20,23,58,.22),inset .6cqw .8cqw 1.4cqw rgba(255,255,255,.55);
    animation:pop .9s cubic-bezier(.2,1.5,.4,1) var(--d) backwards;
    transition:transform .25s;
  }
  .ball::after{content:"";position:absolute;top:9%;left:16%;width:34%;height:20%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));transform:rotate(-24deg)}
  .ball svg{position:relative;z-index:1;width:46%;height:46%;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 .3cqw .5cqw rgba(0,0,0,.28))}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  .orb:hover .ball,.orb:focus-visible .ball{transform:scale(1.12)}
  .pill{
    position:absolute;top:calc(100% + .9cqw);left:50%;transform:translateX(-50%);width:max-content;max-width:27cqw;
    padding:3px 9px;font-family:var(--body);font-weight:600;font-size:clamp(10.5px,2.3cqw,15px);line-height:1.4;color:var(--ink);
    background:rgba(255,255,255,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--glass-edge);border-radius:12px;box-shadow:0 6px 16px -8px rgba(40,50,140,.4);transition:background .2s,color .2s;
  }
  .orb:hover .pill,.orb:focus-visible .pill{background:var(--c);color:#fff;border-color:transparent}

  /* ---------- شريط المهارات المتحرك ---------- */
  .band{
    position:relative;z-index:3;transform:rotate(-1.6deg);margin:20px -3% 0;padding:16px 0;overflow:hidden;
    background:var(--foil);background-size:200% 100%;background-repeat:repeat-x;animation:foil 16s linear infinite;
    box-shadow:0 18px 40px -20px rgba(109,75,255,.6);
  }
  .track{display:flex;width:max-content;direction:ltr;animation:marq 42s linear infinite}
  .track span{display:inline-flex;align-items:center;gap:34px;padding-inline-end:34px;font-family:var(--display);font-weight:900;font-size:clamp(24px,3.4vw,44px);line-height:1.4;color:#fff;white-space:nowrap;direction:rtl}
  html[dir="ltr"] .track span{direction:ltr}
  .track span::after{content:"";width:14px;height:14px;background:rgba(255,255,255,.85);transform:rotate(45deg);border-radius:3px}
  @keyframes marq{to{transform:translateX(-50%)}}

  /* ---------- الأقسام العامة ---------- */
  section{padding:96px 0}
  .sec-title{font-family:var(--display);font-weight:900;font-size:clamp(30px,4.4vw,56px);line-height:1.4;margin-bottom:14px;text-wrap:balance}
  .sec-sub{color:var(--muted);max-width:40em;font-size:clamp(16px,1.4vw,18.5px)}

  /* كرة زجاجية عامة */
  .gorb{
    --sz:56px;
    position:relative;display:grid;place-items:center;width:var(--sz);height:var(--sz);border-radius:50%;flex:none;
    background:radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--c) 40%,#fff) 0%,var(--c) 48%,color-mix(in srgb,var(--c) 72%,#14173A) 100%);
    box-shadow:0 12px 22px -10px color-mix(in srgb,var(--c) 75%,transparent),inset -5px -7px 12px rgba(20,23,58,.22),inset 3px 4px 8px rgba(255,255,255,.55);
  }
  .gorb::after{content:"";position:absolute;top:9%;left:16%;width:34%;height:20%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));transform:rotate(-24deg)}
  .gorb svg{position:relative;z-index:1;width:46%;height:46%;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 3px rgba(0,0,0,.28))}
  .gorb b{position:relative;z-index:1;font-family:var(--display);font-weight:900;font-size:calc(var(--sz) * .4);color:#fff;text-shadow:0 2px 6px rgba(20,23,58,.35);direction:ltr}

  /* ---------- البرامج: منظومة مهارات المستقبل ---------- */
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:22px;margin-top:44px}
  .program{
    --rx:0deg;--ry:0deg;--ty:0px;
    position:relative;display:flex;flex-direction:column;gap:16px;min-height:430px;
    grid-column:span var(--span);padding:32px 30px 28px;border-radius:30px;overflow:hidden;isolation:isolate;
    background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-edge);box-shadow:0 22px 46px -30px rgba(40,50,140,.55);
    transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--ty));
    transition:transform .25s ease-out,box-shadow .3s,border-color .3s;
  }
  .program::before{ /* ضوء يتبع المؤشر */
    content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;
    background:radial-gradient(360px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--c) 26%,transparent),transparent 70%);
  }
  .p-media{ /* صورة البرنامج: تظهر عند التمرير، وإن لم توجد الصورة يظهر تدرج بلون البرنامج */
    position:absolute;inset:0;z-index:-2;opacity:0;transform:scale(1.08);
    background-size:cover,cover;background-position:30% 40%,0 0;
    transition:opacity .5s ease,transform 1.2s ease;animation:pan 16s ease-in-out infinite alternate;
  }
  .p-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,23,58,.28) 0%,rgba(20,23,58,.86) 100%)}
  @keyframes pan{from{background-position:30% 40%,0 0}to{background-position:70% 60%,0 0}}
  .p-mark{position:absolute;z-index:-1;inset-inline-end:-30px;bottom:-40px;width:240px;height:240px;stroke:var(--c);fill:none;stroke-width:.6;stroke-linecap:round;stroke-linejoin:round;opacity:.2;transition:opacity .4s}
  .p-num{
    position:absolute;inset-block-start:20px;inset-inline-end:26px;direction:ltr;
    font-family:var(--display);font-weight:800;font-size:58px;line-height:1;color:transparent;
    -webkit-text-stroke:1.5px color-mix(in srgb,var(--c) 75%,transparent);transition:-webkit-text-stroke-color .3s;
  }
  .program .gorb{--sz:78px}
  .p-titles h3{font-family:var(--display);font-weight:900;font-size:clamp(22px,2.2vw,29px);line-height:1.45;transition:color .3s}
  .p-sub{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);transition:color .3s}
  .p-desc{color:var(--muted);font-size:16px;line-height:1.85;max-width:32em;transition:color .3s}
  .p-more{margin-top:auto;display:grid;gap:16px;transition:opacity .4s,transform .4s}
  .p-focus b{display:block;font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--muted);margin-bottom:8px;transition:color .3s}
  .p-focus ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px}
  .p-focus li{padding:4px 13px;border-radius:999px;font-size:14px;font-weight:500;background:color-mix(in srgb,var(--c) 13%,#fff);border:1px solid color-mix(in srgb,var(--c) 30%,#fff);color:var(--ink);transition:background .3s,border-color .3s,color .3s}
  .p-btn{
    align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:11px 22px;border-radius:14px;
    background:color-mix(in srgb,var(--c) 72%,#14173A);color:#fff;font-family:var(--display);font-weight:600;font-size:15px;
    transition:background .3s,color .3s;
  }
  .p-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform:scaleX(var(--flip));transition:transform .25s}

  /* أجهزة فيها ماوس: الإضافات تظهر عند التمرير */
  @media (hover:hover){
    .p-more{opacity:0;transform:translateY(16px)}
    .program:is(:hover,:focus-visible){--ty:-12px;border-color:color-mix(in srgb,var(--c) 60%,#fff);box-shadow:0 34px 60px -28px var(--c)}
    .program:is(:hover,:focus-visible)::before{opacity:1}
    .program:is(:hover,:focus-visible) .p-media{opacity:1;transform:scale(1)}
    .program:is(:hover,:focus-visible) .p-mark{opacity:0}
    .program:is(:hover,:focus-visible) .p-more{opacity:1;transform:none}
    .program:is(:hover,:focus-visible) .p-titles h3,
    .program:is(:hover,:focus-visible) .p-desc{color:#fff}
    .program:is(:hover,:focus-visible) .p-sub,
    .program:is(:hover,:focus-visible) .p-focus b{color:rgba(255,255,255,.82)}
    .program:is(:hover,:focus-visible) .p-num{-webkit-text-stroke-color:rgba(255,255,255,.75)}
    .program:is(:hover,:focus-visible) .p-focus li{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5);color:#fff}
    .program:is(:hover,:focus-visible) .p-btn{background:#fff;color:var(--ink)}
    .program:is(:hover,:focus-visible) .p-btn svg{transform:translateX(calc(var(--fx) * 5px)) scaleX(var(--flip))}
  }

  /* ---------- لماذا مهارات القرن 21 ---------- */
  .why-head{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end}
  .why .duo{font-size:clamp(22px,2.8vw,36px)}
  .skills{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
  .skill{
    display:flex;gap:18px;align-items:flex-start;padding:28px 26px;border-radius:26px;
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--glass-edge);box-shadow:0 18px 40px -28px rgba(40,50,140,.5);
    transition:transform .25s,box-shadow .25s;
  }
  .skill:hover{transform:translateY(-6px);box-shadow:0 26px 44px -26px var(--c)}
  .skill h3{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.5;margin-bottom:2px}
  .skill p{color:var(--muted);font-size:15.5px;line-height:1.75}

  /* ---------- الأرقام ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,280px));justify-content:center;gap:22px;margin-top:48px}
  .stat{
    text-align:center;padding:34px 20px 28px;border-radius:28px;
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--glass-edge);box-shadow:0 22px 44px -30px var(--c);
  }
  .stat .num{
    display:block;direction:ltr;font-family:var(--display);font-weight:900;font-size:clamp(46px,5.4vw,72px);line-height:1.15;

const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
let LANG = "ar";
const T = (path, lang=LANG) => path.split(".").reduce((o,k)=> (o==null ? o : o[k]), I18N[lang]);

function applyLang(lang){
  LANG = lang;
  const de = document.documentElement;
  de.lang = lang; de.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el=>{ const v = T(el.dataset.t); if (v != null) el.textContent = v; });
  document.querySelectorAll("[data-t-aria]").forEach(el=>{ const v = T(el.dataset.tAria); if (v != null) el.setAttribute("aria-label", v); });
  document.querySelectorAll("[data-ar]").forEach(el=>{ el.textContent = el.dataset[lang] || el.dataset.ar; });
  document.querySelectorAll("[data-alt-lang]").forEach(el=>{ const o = lang === "ar" ? "en" : "ar"; el.lang = o; el.dir = o === "ar" ? "rtl" : "ltr"; });
  document.title = T("meta.title");
  const md = document.querySelector('meta[name="description"]'); if (md) md.content = T("meta.description");
  LS.set("lang", lang);
}

/* الأرقام + العدّاد المتحرك */
(function(){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const shown = STATS.filter(s => s.symbol || (typeof s.value === "number"));
  const box = document.getElementById("statsGrid");
  box.innerHTML = shown.map(s=>`
    <div class="stat" style="--c:${s.color}">
      ${s.symbol
        ? `<b class="num">${s.symbol}</b>`
        : `<b class="num" data-to="${s.value}" data-suffix="${s.suffix||""}">${reduce ? s.value + (s.suffix||"") : "0"}</b>`}
      <span class="lbl" data-t="stats.labels.${s.key}"></span>
    </div>`).join("");
  if (reduce) return;
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if (!en.isIntersecting) return;
      io.unobserve(en.target);
      const el = en.target, to = +el.dataset.to, suf = el.dataset.suffix || "", t0 = performance.now(), dur = 1700;
      (function step(now){
        const p = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(to*e) + suf;
        if (p < 1) requestAnimationFrame(step);
      })(t0);
    });
  }, { threshold:.5 });
  box.querySelectorAll("[data-to]").forEach(el=>io.observe(el));
})();

/* ============================================================
   5) الهيرو: جزيئات تتفاعل مع المؤشر + ميلان المدارات
   ============================================================ */
(function heroFx(){
  const cv = document.getElementById("fx"), hero = document.getElementById("top"), scene = document.getElementById("scene");
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const colors = PROGRAMS.map(p=>p.color);
  let W=0,H=0,pts=[],mouse={x:-999,y:-999},visible=true;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    W = hero.clientWidth; H = hero.clientHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(70, W*H/15000));
    pts = Array.from({length:n}, ()=>({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35,
      r:1.6+Math.random()*2.6, c:colors[(Math.random()*colors.length)|0]
    }));
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    for (const p of pts){
      if (!reduce){
        p.x += p.vx; p.y += p.vy;
        if (p.x<0||p.x>W) p.vx*=-1;
        if (p.y<0||p.y>H) p.vy*=-1;
        const dx=p.x-mouse.x, dy=p.y-mouse.y, d2=dx*dx+dy*dy;
        if (d2<150*150 && d2>1){ const d=Math.sqrt(d2), f=(150-d)/150*1.6; p.x+=dx/d*f; p.y+=dy/d*f; }
      }
    }
    for (let i=0;i<pts.length;i++){
      const a=pts[i];
      for (let j=i+1;j<pts.length;j++){
        const b=pts[j], dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy);
        if (d<130){
          ctx.strokeStyle=`rgba(80,90,190,${(0.2*(1-d/130)).toFixed(3)})`;
          ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }
    for (const p of pts){
      ctx.globalAlpha=.16; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*3,0,6.283); ctx.fill();
      ctx.globalAlpha=.85; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function loop(){ if (visible) draw(); requestAnimationFrame(loop); }

  resize();
  window.addEventListener("resize", resize);
  if (reduce){ draw(); }
  else {
    loop();
    new IntersectionObserver(es=>{ visible = es[0].isIntersecting; }).observe(hero);
  }

  hero.addEventListener("pointermove", e=>{
    const r = hero.getBoundingClientRect();
    mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
    if (!reduce){
      const nx = mouse.x/r.width, ny = mouse.y/r.height;
      scene.style.setProperty("--rx", ((0.5-ny)*10).toFixed(2)+"deg");
      scene.style.setProperty("--ry", ((nx-0.5)*12).toFixed(2)+"deg");
    }
  });
  hero.addEventListener("pointerleave", ()=>{
    mouse.x = mouse.y = -999;
    scene.style.setProperty("--rx","0deg"); scene.style.setProperty("--ry","0deg");
  });
})();

const GALLERY = [];

(function buildBento(){
  const root = document.getElementById("bento");
  const box = document.getElementById("mediaBox"), fig = document.getElementById("mediaFig"), xBtn = box.querySelector(".x");
  const SPANS = [6,6,3,6,3];
  const COLORS = ["#6D4BFF","#FF4D8D","#16B8E0","#FF9A1F","#10C38B"];
  const ICON = {
    photo:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-8 8"/>',
    video:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/>'
  };
  const esc = v => String(v||"").replace(/"/g,"&quot;");
  const items = GALLERY.length ? GALLERY : ["photo","video","photo","photo","video"].map(t=>({ type:t, ph:true }));

  root.innerHTML = items.map((g,i)=>{
    const span = SPANS[i % SPANS.length], c = COLORS[i % COLORS.length];
    if (g.ph) return `
      <div class="b-tile ph" style="--span:${span};--c:${c}">
        <span class="gorb" style="--sz:64px"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[g.type]}</svg></span>
        <b data-t="gal.${g.type}"></b><span class="soon" data-t="ach.soon"></span>
      </div>`;
    const thumb = g.type === "video" ? (g.poster || "") : g.src;
    return `
      <button class="b-tile" type="button" data-i="${i}" style="--span:${span};--c:${c}">
        ${thumb ? `<img src="${thumb}" alt="" loading="lazy">` : ""}
        ${g.type === "video" ? `<span class="play"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON.video}</svg></span>` : ""}

  }).join("");

  function close(){ box.hidden = true; fig.innerHTML = ""; }   // إغلاق الفيديو يوقف تشغيله
  box.addEventListener("click", e=>{ if (e.target === box || e.target === xBtn) close(); });
  document.addEventListener("keydown", e=>{ if (e.key === "Escape" && !box.hidden) close(); });
  root.querySelectorAll("button.b-tile").forEach(b=>b.addEventListener("click", ()=>{
    const g = GALLERY[+b.dataset.i], cap = b.querySelector(".cap").textContent;

      ? `<video src="${g.src}" ${g.poster ? `poster="${g.poster}"` : ""} controls autoplay playsinline></video>`

    box.hidden = false; xBtn.focus();
  }));

  if (DRIVE_FOLDER_ID && DRIVE_SCRIPT_URL && window.DriveGallery) {
    DriveGallery.tryRender(root, DRIVE_FOLDER_ID, DRIVE_SCRIPT_URL, SPANS, COLORS);
  }
})();
